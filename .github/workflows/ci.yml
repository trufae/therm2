name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: ./scripts/build.sh debug

      - name: Test
        run: ./scripts/test.sh
